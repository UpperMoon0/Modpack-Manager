name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: node --check scripts/prepare-release.mjs
      - run: node --check scripts/prepare-windows-signing.mjs
      - name: Exercise Windows signing config helper
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-windows-signing.mjs 0123456789ABCDEF0123456789ABCDEF01234567
          node - <<'NODE'
          const fs = require("fs");
          const config = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
          const windows = config.bundle?.windows ?? {};
          if (windows.certificateThumbprint !== "0123456789ABCDEF0123456789ABCDEF01234567") process.exit(1);
          if (windows.digestAlgorithm !== "sha256") process.exit(1);
          if (!windows.timestampUrl) process.exit(1);
          NODE
          git checkout -- src-tauri/tauri.conf.json

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p patch-core -p modpackctl
      - run: cargo clippy -p patch-core -p modpackctl --all-targets -- -D warnings
      - name: Resolve pinned TFG fork client/server profiles
        env:
          MODPACK_MANAGER_TFG_MANIFEST: https://raw.githubusercontent.com/UpperMoon0/Modpack-Modern/nstut-0.13.10.2/nstut/modpack-manager.patch.json
          MODPACK_MANAGER_TFG_MANAGED_MODS: https://raw.githubusercontent.com/UpperMoon0/Modpack-Modern/nstut-0.13.10.2/nstut/managed-mods.json
        run: |
          ROOT="$RUNNER_TEMP/tfg-smoke"
          mkdir -p "$ROOT/mods" "$ROOT/config" "$ROOT/kubejs" "$ROOT/defaultconfigs" "$ROOT/world/serverconfig/ftbranks"
          echo 'level-name=world' > "$ROOT/server.properties"
          cat > "$ROOT/config/gtceu.yaml" <<'YAML'
          machines:
            shouldWeatherOrTerrainExplosion: true
          YAML
          : > "$ROOT/defaultconfigs/createhorsepower-server.toml"
          : > "$ROOT/mods/createhorsepower-legacy.jar"
          : > "$ROOT/mods/create-precise-controls-old.jar"
          cat > "$ROOT/world/serverconfig/ftbchunks-world.snbt" <<'SNBT'
          {
            max_claimed_chunks: 500
            max_force_loaded_chunks: 25
          }
          SNBT
          cat > "$ROOT/world/serverconfig/ftbranks/ranks.snbt" <<'SNBT'
          {
            member: {
              ftbchunks.max_claimed: 50
              ftbchunks.max_force_loaded: 8
            }
            admin: {
              ftbchunks.max_claimed: 10000
              ftbchunks.max_force_loaded: 10000
            }
          }
          SNBT

          cargo run --quiet -p modpackctl -- plan --tfg --target client --root "$ROOT" --json > "$RUNNER_TEMP/tfg-client.json"
          cargo run --quiet -p modpackctl -- plan --tfg --target server --root "$ROOT" --json > "$RUNNER_TEMP/tfg-server.json"

          jq -e '[.items[] | select(.kind == "install")] | length == 8' "$RUNNER_TEMP/tfg-client.json"
          jq -e '[.items[] | select(.kind == "install")] | length == 6' "$RUNNER_TEMP/tfg-server.json"
          jq -e 'any(.items[]; .kind == "install" and .detail == "Install verified artifact openui")' "$RUNNER_TEMP/tfg-client.json"
          jq -e 'all(.items[]; .detail != "Install verified artifact openui")' "$RUNNER_TEMP/tfg-server.json"
          jq -e 'any(.items[]; .kind == "install" and .detail == "Install verified artifact create-precise-controls")' "$RUNNER_TEMP/tfg-client.json"
          jq -e 'all(.items[]; .detail != "Install verified artifact create-precise-controls")' "$RUNNER_TEMP/tfg-server.json"
          jq -e 'any(.items[]; .kind == "remove" and .path == "mods/createhorsepower-legacy.jar")' "$RUNNER_TEMP/tfg-server.json"
          jq -e 'any(.items[]; .kind == "remove" and .path == "mods/create-precise-controls-old.jar")' "$RUNNER_TEMP/tfg-server.json"
          jq -e 'all(.items[]; .path != "kubejs/server_scripts/create_horse_power/recipes.js")' "$RUNNER_TEMP/tfg-client.json"
          jq -e 'all(.items[]; .path != "kubejs/server_scripts/create_horse_power/recipes.js")' "$RUNNER_TEMP/tfg-server.json"
          jq -e 'any(.items[]; .kind == "patchToml" and .path == "defaultconfigs/createhorsepower-server.toml")' "$RUNNER_TEMP/tfg-client.json"
          jq -e 'any(.items[]; .kind == "patchToml" and .path == "defaultconfigs/createhorsepower-server.toml")' "$RUNNER_TEMP/tfg-server.json"
          jq -e 'all(.items[]; .kind != "patchYaml" or .path != "config/gtceu.yaml")' "$RUNNER_TEMP/tfg-client.json"
          jq -e 'any(.items[]; .kind == "patchYaml" and .path == "config/gtceu.yaml")' "$RUNNER_TEMP/tfg-server.json"
          jq -e 'all(.items[]; .kind != "patchSnbt")' "$RUNNER_TEMP/tfg-client.json"
          jq -e 'any(.items[]; .kind == "patchSnbt" and .path == "world/serverconfig/ftbchunks-world.snbt")' "$RUNNER_TEMP/tfg-server.json"
          jq -e 'any(.items[]; .kind == "patchSnbt" and .path == "world/serverconfig/ftbranks/ranks.snbt")' "$RUNNER_TEMP/tfg-server.json"
          jq -e 'all(.items[]; .path != "world/serverconfig/createhorsepower-server.toml")' "$RUNNER_TEMP/tfg-server.json"
          jq -e 'all(.items[]; .path != "serverconfig/createhorsepower-server.toml")' "$RUNNER_TEMP/tfg-server.json"

  tauri-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm install --no-audit --no-fund
      - run: npm run tauri build -- --debug
