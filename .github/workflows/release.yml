name: Release

on:
  push:
    branches: [main]
    paths:
      - "VERSION"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modpack-manager-release
  cancel-in-progress: false

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION must contain SemVer, got: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  validate:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: cargo test -p patch-core -p modpackctl
      - run: bash -n scripts/patch-server.sh
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - run: cargo clippy -p patch-core -p modpackctl --all-targets -- -D warnings
      - run: node --check scripts/prepare-release.mjs
      - run: node --check scripts/prepare-windows-signing.mjs

  windows-client:
    needs: [resolve-version, validate]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm install --no-audit --no-fund

      - name: Require updater signing credentials
        shell: pwsh
        env:
          RAW_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:RAW_TAURI_SIGNING_PRIVATE_KEY)) { $missing += "TAURI_SIGNING_PRIVATE_KEY" }
          if ([string]::IsNullOrWhiteSpace($env:RAW_TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) { $missing += "TAURI_SIGNING_PRIVATE_KEY_PASSWORD" }
          if ($missing.Count -gt 0) {
            throw ("Stable releases require Tauri updater signing. Missing: " + ($missing -join ", "))
          }

      - id: windows-signing
        name: Detect optional Windows Authenticode credentials
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)
          if ($hasCertificate -xor $hasPassword) {
            throw "Configure both WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD, or neither"
          }
          $enabled = $hasCertificate -and $hasPassword
          "enabled=$($enabled.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($enabled) {
            Write-Host "Windows Authenticode signing is enabled"
          } else {
            Write-Host "Windows Authenticode signing is not configured; installers will be built without it"
          }
      - id: windows-cert
        name: Import and validate trusted Windows code-signing certificate
        if: steps.windows-signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $pfxPath = Join-Path $env:RUNNER_TEMP "modpack-manager-codesign.pfx"
          $encodedPfx = $env:WINDOWS_CERTIFICATE
          $encodedPfx = $encodedPfx -replace "-----BEGIN [^-]+-----", ""
          $encodedPfx = $encodedPfx -replace "-----END [^-]+-----", ""
          $encodedPfx = $encodedPfx -replace "\\s+", ""
          try {
            [byte[]]$pfxBytes = [Convert]::FromBase64String($encodedPfx)
          } catch {
            throw "WINDOWS_CERTIFICATE is not valid base64 PFX data"
          }
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)

          $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $imported = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword -Exportable:$false)
          if ($imported.Count -lt 1) { throw "Could not import Windows code-signing certificate" }

          function Test-CodeSigningEku([System.Security.Cryptography.X509Certificates.X509Certificate2]$candidate) {
            foreach ($extension in $candidate.Extensions) {
              if ($extension -is [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]) {
                foreach ($oid in $extension.EnhancedKeyUsages) {
                  if ($oid.Value -eq "1.3.6.1.5.5.7.3.3") { return $true }
                }
              }
            }
            return $false
          }

          $cert = $imported |
            Where-Object { $_.HasPrivateKey -and (Test-CodeSigningEku $_) } |
            Select-Object -First 1
          if ($null -eq $cert) { throw "PFX does not contain a private Code Signing certificate" }
          if ($cert.NotAfter.ToUniversalTime() -le [DateTime]::UtcNow) { throw "Windows code-signing certificate is expired" }

          $chain = [System.Security.Cryptography.X509Certificates.X509Chain]::new()
          $chain.ChainPolicy.RevocationMode = [System.Security.Cryptography.X509Certificates.X509RevocationMode]::Online
          $chain.ChainPolicy.RevocationFlag = [System.Security.Cryptography.X509Certificates.X509RevocationFlag]::ExcludeRoot
          if (-not $chain.Build($cert)) {
            $errors = $chain.ChainStatus | ForEach-Object { $_.StatusInformation.Trim() }
            throw ("Windows certificate chain is not trusted: " + ($errors -join "; "))
          }

          "thumbprint=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Trusted Code Signing certificate validated: subject=$($cert.Subject)"

      - name: Prepare tagged app version and updater artifacts
        run: node scripts/prepare-release.mjs "${{ needs.resolve-version.outputs.tag }}"

      - name: Configure trusted Windows Authenticode signing
        if: steps.windows-signing.outputs.enabled == 'true'
        run: node scripts/prepare-windows-signing.mjs "${{ steps.windows-cert.outputs.thumbprint }}"

      - name: Normalize and validate updater signing key
        shell: pwsh
        env:
          RAW_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $raw = $env:RAW_TAURI_SIGNING_PRIVATE_KEY
          $password = $env:RAW_TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          $trimmed = $raw.Trim()
          try {
            $decoded = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($trimmed)).Trim()
          } catch {
            throw "Updater signing key is not valid Tauri base64 key content"
          }
          if (-not $decoded.StartsWith("untrusted comment:")) {
            throw "Updater signing key does not decode to a Tauri secret-key box"
          }

          $keyPath = Join-Path $env:RUNNER_TEMP "tauri-updater.key"
          [IO.File]::WriteAllText($keyPath, $trimmed, [Text.UTF8Encoding]::new($false))
          $probePath = Join-Path $env:RUNNER_TEMP "tauri-updater-key-probe.bin"
          $signaturePath = $probePath + ".sig"
          Remove-Item -LiteralPath $signaturePath -Force -ErrorAction SilentlyContinue
          [IO.File]::WriteAllText($probePath, "modpack-manager-updater-key-probe", [Text.UTF8Encoding]::new($false))

          & ".\node_modules\.bin\tauri.cmd" signer sign $probePath --private-key-path $keyPath --password $password --app-version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $signaturePath)) {
            throw "Tauri could not sign a probe with the configured updater key"
          }

          try {
            $signatureFile = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String((Get-Content $signaturePath -Raw).Trim()))
            $signatureLines = $signatureFile -split "\r?\n" | Where-Object { $_.Trim().Length -gt 0 }
            [byte[]]$signatureBlob = [Convert]::FromBase64String($signatureLines[1].Trim())
            $tauri = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
            $publicFile = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String([string]$tauri.plugins.updater.pubkey))
            $publicLines = $publicFile -split "\r?\n" | Where-Object { $_.Trim().Length -gt 0 }
            [byte[]]$publicBlob = [Convert]::FromBase64String($publicLines[1].Trim())
          } catch {
            throw "Could not parse updater probe signature or embedded public key"
          }
          if ($signatureBlob.Length -lt 10 -or $publicBlob.Length -lt 10) { throw "Updater key payload is too short" }
          $signatureKeyId = ([BitConverter]::ToString([byte[]]$signatureBlob[2..9])).Replace("-", "")
          $publicKeyId = ([BitConverter]::ToString([byte[]]$publicBlob[2..9])).Replace("-", "")
          if ($signatureKeyId -ne $publicKeyId) {
            throw "Updater private key does not match the public key embedded in tauri.conf.json"
          }

          "TAURI_SIGNING_PRIVATE_KEY_PATH=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Remove-Item -LiteralPath $probePath,$signaturePath -Force -ErrorAction SilentlyContinue
          Write-Host "Updater signing key validated against embedded public key"

      - name: Build Windows client into draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.resolve-version.outputs.tag }}
          releaseName: "Modpack Manager ${{ needs.resolve-version.outputs.tag }}"
          releaseBody: |
            TFG Modpack Manager desktop client and server patch CLI.

            Tauri updater artifacts are signed for cryptographic update verification.
          releaseCommitish: ${{ github.sha }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterSignatures: true

      - name: Verify Windows Authenticode signatures
        if: steps.windows-signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundles = Get-ChildItem -LiteralPath target\release\bundle -Recurse -File |
            Where-Object { $_.Extension -in @(".exe", ".msi") }
          if ($bundles.Count -lt 2) { throw "Expected NSIS and MSI bundles" }

          foreach ($bundle in $bundles) {
            $signature = Get-AuthenticodeSignature -LiteralPath $bundle.FullName
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              throw "Invalid Authenticode signature on $($bundle.FullName): $($signature.Status) $($signature.StatusMessage)"
            }
            if ($null -eq $signature.SignerCertificate) {
              throw "Signed bundle has no signer certificate: $($bundle.FullName)"
            }
            Write-Host "AUTHENTICODE_OK file=$($bundle.Name) subject=$($signature.SignerCertificate.Subject)"
          }

      - name: Publish SHA-256 checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-version.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $bundles = Get-ChildItem -LiteralPath target\release\bundle -Recurse -File |
            Where-Object { $_.Extension -in @(".exe", ".msi") } |
            Sort-Object Name
          $lines = foreach ($bundle in $bundles) {
            $hash = (Get-FileHash -LiteralPath $bundle.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($bundle.Name)"
          }
          $checksumPath = Join-Path $env:RUNNER_TEMP "SHA256SUMS-windows.txt"
          [IO.File]::WriteAllLines($checksumPath, $lines, [Text.UTF8Encoding]::new($false))
          gh release upload "$env:TAG" "$checksumPath" --clobber

      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-version.outputs.tag }}
        run: gh release edit "$env:TAG" --draft=false

  linux-server-cli:
    needs: [resolve-version, windows-client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p modpackctl
      - name: Package server CLI
        run: |
          mkdir -p dist
          cp target/release/modpackctl dist/
          cp scripts/patch-server.sh dist/
          tar -C dist -czf modpackctl-linux-x86_64.tar.gz modpackctl patch-server.sh
          sha256sum modpackctl-linux-x86_64.tar.gz > modpackctl-linux-x86_64.tar.gz.sha256
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.resolve-version.outputs.tag }}" \
            modpackctl-linux-x86_64.tar.gz \
            modpackctl-linux-x86_64.tar.gz.sha256 \
            --clobber
