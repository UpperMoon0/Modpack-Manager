[package]
name = "patch-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
globset = "0.4"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.47", features = ["fs", "io-util"] }
url = "2.5"
walkdir = "2.5"
zip = { version = "4.6", default-features = false, features = ["deflate", "deflate64", "bzip2", "zstd"] }

[dev-dependencies]
tempfile = "3.21"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
